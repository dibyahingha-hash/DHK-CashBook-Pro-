
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Assam Primary School Accounts Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-header no-print">
    <div class="school-badge">
      <span id="disp-school-name">School Account Setup</span>
      <small id="disp-udise-code">UDISE: Not Configured</small>
    </div>
  </header>

  <!-- Navigation Bar (6 Modules) -->
  <nav class="nav-bar no-print">
    <button class="nav-btn active" id="btn-setup" onclick="switchModule('setup')">⚙️ Setup</button>
    <button class="nav-btn" id="btn-daily" onclick="switchModule('daily')">📅 Daily Log</button>
    <button class="nav-btn" id="btn-stock" onclick="switchModule('stock')">🍚 MDM Stock</button>
    <button class="nav-btn" id="btn-mdm_cash" onclick="switchModule('mdm_cash')">📖 MDM Cash</button>
    <button class="nav-btn" id="btn-smc_cash" onclick="switchModule('smc_cash')">🏫 SMC Cash</button>
    <button class="nav-btn" id="btn-sna_cash" onclick="switchModule('sna_cash')">🏛️ Canara SNA</button>
    <button class="nav-btn" id="btn-ledger" onclick="switchModule('ledger')">📒 Ledger</button>
  </nav>

  <main class="main-container">

    <!-- MODULE 0: SCHOOL SETUP & UDISE REGISTRATION -->
    <section class="module-view active" id="view-setup">
      <div class="card no-print">
        <h2 class="card-title">School Profile & UDISE Setup</h2>
        <div class="grid-2 form-group">
          <div>
            <label>11-Digit UDISE+ Code</label>
            <input type="text" id="cfg-udise" maxlength="11" placeholder="e.g. 18010100101">
          </div>
          <div>
            <label>School Name</label>
            <input type="text" id="cfg-name" placeholder="e.g. Milan Primary School">
          </div>
        </div>
        <div class="grid-2 form-group">
          <div>
            <label>Education Block / CRC</label>
            <input type="text" id="cfg-block" placeholder="e.g. Cluster / Block">
          </div>
          <div>
            <label>District</label>
            <input type="text" id="cfg-district" placeholder="e.g. Nagaon">
          </div>
        </div>
        <div class="grid-2 form-group">
          <div>
            <label>Head Teacher / In-charge Name</label>
            <input type="text" id="cfg-ht-name" placeholder="Teacher Name">
          </div>
          <div>
            <label>Mobile Number</label>
            <input type="tel" id="cfg-mobile" maxlength="10" placeholder="10-digit mobile">
          </div>
        </div>

        <h3 class="section-subtitle">Statutory MDM Rates (Configurable)</h3>
        <div class="grid-2 form-group">
          <div>
            <label>LP Cooking Cost (₹/meal)</label>
            <input type="number" step="0.01" id="cfg-rate-lp" value="6.78">
          </div>
          <div>
            <label>UP Cooking Cost (₹/meal)</label>
            <input type="number" step="0.01" id="cfg-rate-up" value="10.15">
          </div>
        </div>
        <div class="grid-2 form-group">
          <div>
            <label>LP Rice Allocation (kg/meal)</label>
            <input type="number" step="0.001" id="cfg-rice-lp" value="0.100">
          </div>
          <div>
            <label>UP Rice Allocation (kg/meal)</label>
            <input type="number" step="0.001" id="cfg-rice-up" value="0.150">
          </div>
        </div>

                <button class="btn btn-primary" onclick="saveSchoolProfile()">💾 Save School Profile</button>
        <button class="btn" style="background:#dc2626; margin-top:10px;" onclick="resetTransactionDataOnly()">🗑️ Clear All Test Records & Start Fresh</button>

      </div>
    </section>

    <!-- MODULE 1: DAILY ATTENDANCE & MEALS LOGGER -->
    <section class="module-view" id="view-daily">
      <div class="card no-print">
        <h2 class="card-title">Daily Attendance Entry (10-Second Routine)</h2>
        <div class="grid-2 form-group">
          <div>
            <label>Date</label>
            <input type="date" id="daily-date" onchange="onDailyDateChange()">
          </div>
          <div>
            <label>School Status</label>
            <select id="daily-status" onchange="toggleDailyStatus()">
              <option value="OPEN">School Open (Meals Served)</option>
              <option value="SUNDAY">Sunday</option>
              <option value="HOLIDAY">Holiday / Vacation</option>
            </select>
          </div>
        </div>

        <div id="daily-meal-inputs" class="grid-2 form-group">
          <div>
            <label>LP Attendance (Classes 1–5)</label>
            <input type="number" id="daily-lp" min="0" placeholder="0">
          </div>
          <div>
            <label>UP Attendance (Classes 6–8)</label>
            <input type="number" id="daily-up" min="0" placeholder="0">
          </div>
        </div>

        <button class="btn btn-secondary" onclick="saveDailyEntry()">✔️ Record Daily Attendance</button>
      </div>

      <!-- Calendar / Monthly Entries List -->
      <div class="card no-print">
        <h3 class="card-title">Daily Entries Log</h3>
        <div class="form-group" style="max-width:200px; margin-bottom:8px;">
          <label>View Month</label>
          <input type="month" id="daily-filter-ym" onchange="renderDailyLogTable()">
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Status</th>
                <th class="num">LP</th>
                <th class="num">UP</th>
                <th class="num">Rice (kg)</th>
                <th class="num">Cost (₹)</th>
                <th class="no-print" style="width:30px;">Action</th>
              </tr>
            </thead>
            <tbody id="daily-log-rows"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- MODULE 2: MDM STOCK REGISTER -->
    <section class="module-view" id="view-stock">
      <div id="stock-container"></div>
    </section>

    <!-- MODULES 3, 4, 5: CASH BOOKS (MDM, SMC, SNA) -->
    <section class="module-view" id="view-mdm_cash"></section>
    <section class="module-view" id="view-smc_cash"></section>
    <section class="module-view" id="view-sna_cash"></section>

    <!-- MODULE 6: LEDGER BOOK -->
    <section class="module-view" id="view-ledger"></section>

  </main>

  <!-- Script Modules Loaded in Order -->
  <script src="js/storage.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/cashbook.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/print.js"></script>
  <script>
    function switchModule(modId) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.module-view').forEach(v => v.classList.remove('active'));

      const targetView = document.getElementById(`view-${modId}`);
      if (targetView) targetView.classList.add('active');

      const activeBtn = document.getElementById(`btn-${modId}`);
      if (activeBtn) activeBtn.classList.add('active');

      if (modId === 'stock' && window.renderStockView) renderStockView();
      if (modId === 'mdm_cash' && window.renderCashbookView) renderCashbookView('MDM_SAVINGS');
      if (modId === 'smc_cash' && window.renderCashbookView) renderCashbookView('SMC_SAVINGS');
      if (modId === 'sna_cash' && window.renderCashbookView) renderCashbookView('SMC_CANARA_SNA');
      if (modId === 'ledger' && window.renderLedgerView) renderLedgerView();
    }
  </script>
</body>
</html>
